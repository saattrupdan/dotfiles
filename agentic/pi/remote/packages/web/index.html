<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#111715"
    />
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />
    <link
      rel="manifest"
      href="/manifest.webmanifest"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />
    <link
      rel="stylesheet"
      href="/startup.css"
    />
    <script
      src="/startup.js"
      defer
    ></script>
    <title>Pi Remote</title>
  </head>
  <body>
    <div id="app">
      <section
        id="startup"
        class="startup"
        role="status"
        aria-live="polite"
      >
        <img
          src="/icons/pi.svg"
          alt="Pi"
          width="128"
          height="128"
        />
        <h1 id="startup-title">Opening Pi Remote</h1>
        <p id="startup-message">Connecting to your Mac.</p>
        <span
          id="startup-spinner"
          class="startup-spinner"
          aria-hidden="true"
        ></span>
        <button
          id="startup-retry"
          type="button"
          hidden
        >
          Try again
        </button>
      </section>
    </div>
    <script
      type="module"
      src="/src/frontend/main.ts"
    ></script>
  </body>
</html>
