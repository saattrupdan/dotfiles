[project]
name = "sparkie-kromoss"
version = "0.1.0"
description = "Request-owned Kromoss image workers behind the Sparkie router"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "pillow>=13.0.0",
    "psutil>=7.2.2",
    "pydantic>=2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kromoss"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]
